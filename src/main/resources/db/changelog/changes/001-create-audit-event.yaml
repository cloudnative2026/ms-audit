databaseChangeLog:
  - changeSet:
      id: 001-create-audit-event
      author: pedidos360
      changes:
        - createTable:
            tableName: audit_event
            columns:
              - column: {name: id, type: VARCHAR(36), constraints: {primaryKey: true, nullable: false}}
              - column: {name: event_type, type: VARCHAR(50), constraints: {nullable: false}}
              - column: {name: entity_type, type: VARCHAR(30), constraints: {nullable: false}}
              - column: {name: entity_id, type: VARCHAR(64), constraints: {nullable: false}}
              - column: {name: actor_subject, type: VARCHAR(255)}
              - column: {name: actor_name, type: VARCHAR(255)}
              - column: {name: actor_roles, type: VARCHAR(255)}
              - column: {name: occurred_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
              - column: {name: source_ip, type: VARCHAR(64)}
              - column: {name: user_agent, type: VARCHAR(512)}
              - column: {name: source_service, type: VARCHAR(64)}
              - column: {name: detail, type: VARCHAR(512)}
              - column: {name: received_at, type: TIMESTAMP WITH TIME ZONE, constraints: {nullable: false}}
        - createIndex:
            tableName: audit_event
            indexName: idx_audit_event_occurred_at
            columns:
              - column: {name: occurred_at}
        - createIndex:
            tableName: audit_event
            indexName: idx_audit_event_entity
            columns:
              - column: {name: entity_type}
              - column: {name: entity_id}
